services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://clinic:clinic@db:5432/clinic
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-change-me-0123456789abcdef}
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: AdminPass123
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
