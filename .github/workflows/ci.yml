name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running pipeline
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ CI
  backend:
    name: Backend - lint, tests, coverage, dependency audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://clinic:clinic@localhost:5432/clinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests with coverage gate (fails below 85%)
        run: python -m pytest -v --cov --cov-report=term-missing --cov-fail-under=85
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend - type-check, build, dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=moderate

  docker:
    name: Docker - lint, build, run the whole stack, scan images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint backend Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Lint frontend Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile

      - name: Create a throwaway .env (CI only, random values)
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 12)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_EMAIL=admin@example.com"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 12)"
          } > .env

      - name: Build images and start the whole stack (waits until healthy)
        run: docker compose up -d --build --wait

      - name: Smoke tests against the running containers
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a

          echo "API health"
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"'

          echo "Admin can log in and use the token"
          TOKEN=$(curl -sf -X POST http://localhost:8000/auth/login \
            -d "username=${ADMIN_EMAIL}&password=${ADMIN_PASSWORD}" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -sf -H "Authorization: Bearer ${TOKEN}" http://localhost:8000/users/me | grep -q '"role":"admin"'

          echo "A request without a token is rejected"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/users/me)" = "401"

          echo "Website is served, and deep links fall back to index.html"
          curl -sf http://localhost:5173/doctors | grep -q 'id="root"'

          echo "Security headers are present"
          curl -sI http://localhost:5173/ | grep -qi 'x-content-type-options: nosniff'

          echo "API container does not run as root"
          test "$(docker compose exec -T api id -u)" != "0"

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs --no-color

      - name: Scan images for known vulnerabilities (Trivy)
        run: |
          for image in clinic-booking-api:local clinic-booking-web:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.0 image --no-progress --exit-code 1 \
              --severity HIGH,CRITICAL --ignore-unfixed "$image"
          done

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ CD
  publish:
    name: Publish images to GitHub Container Registry
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image names must be lowercase
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-api:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ env.IMAGE_BASE }}-web:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
